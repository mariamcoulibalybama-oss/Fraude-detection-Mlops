name: fraude-mlops

services:
  # ============================================================
  # INGESTION : Kafka + Zookeeper
  # ============================================================
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: fraude_zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper_data:/bitnami/zookeeper
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - fraude-net
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.6
    container_name: fraude_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms256m
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/bitnami/kafka
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - fraude-net
    restart: unless-stopped

  # ============================================================
  # FEATURE STORE : Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: fraude_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.3'
    networks:
      - fraude-net
    restart: unless-stopped

  # ============================================================
  # STOCKAGE : MongoDB
  # ============================================================
  mongodb:
    image: mongo:7
    container_name: fraude_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-changeme}
      - MONGO_INITDB_DATABASE=fraude
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - fraude-net
    restart: unless-stopped

  # ============================================================
  # MLOPS : MLflow Tracking
  # ============================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: fraude_mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - fraude-net
    restart: unless-stopped

  # ============================================================
  # MONITORING : Prometheus + Grafana
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: fraude_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
    networks:
      - fraude-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: fraude_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
    networks:
      - fraude-net
    restart: unless-stopped

  # ============================================================
  # APPLICATION : Producer, Consumer, Streamlit
  # Décommenter au fur et à mesure du développement
