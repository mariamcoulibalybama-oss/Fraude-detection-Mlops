# ============================================================
# VOLUMES : persistance des données
# ============================================================
volumes:
  zookeeper_data:
  kafka_data:
  redis_data:
  mongodb_data:
  mlflow_data:
  prometheus_data:
  grafana_data:

# ============================================================
# RÉSEAU : isolé des autres stacks Docker du VPS
# ============================================================
networks:
  fraude-net:
    driver: bridge
    name: fraude-net
