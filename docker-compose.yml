name: fraude-mlops

services:

  # ============================================================
  # INGESTION : Kafka + Zookeeper
  # ============================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fraude_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks:
      - fraude-net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraude_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Configuration des Listeners (C'est ici que ça se joue)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://fraude_kafka:29092,EXTERNAL://127.0.0.1:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - fraude-net
    restart: unless-stopped

  # ============================================================
  # FEATURE STORE : Redis
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: fraude_redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - fraude-net
    restart: unless-stopped


  # ============================================================
  # STOCKAGE : MongoDB
  # ============================================================

  mongodb:
    container_name: fraude_mongodb
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
    networks:
      - fraude-net
    restart: unless-stopped


  # ============================================================
  # MLOPS : MLflow Tracking
  # ============================================================

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: fraude_mlflow
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/mlflow
    networks:
      - fraude-net
    restart: unless-stopped


  # ============================================================
  # MONITORING : Prometheus + Grafana
  # ============================================================

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: fraude_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - fraude-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: fraude_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - fraude-net
    restart: unless-stopped


# ============================================================
# VOLUMES : persistance des données
# ============================================================

volumes:
  zookeeper_data:
  kafka_data:
  redis_data:
  mongodb_data:
  mlflow_data:
  prometheus_data:
  grafana_data:


# ============================================================
# RÉSEAU
# ============================================================

networks:
  fraude-net:
    driver: bridge
